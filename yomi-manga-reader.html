
<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<title>YOMI — read into the night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@500;700;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  :root{
    --bg: oklch(15% 0.02 258); --surface: oklch(20% 0.022 258);
    --elevated: oklch(25% 0.026 258); --fg: oklch(93% 0.01 250);
    --muted: oklch(64% 0.02 252); --border: oklch(30% 0.028 258);
    --accent: oklch(78% 0.13 82); --accent-ink: oklch(18% 0.03 258);
    --accent-soft: oklch(30% 0.05 82 / .55);
    --shadow: 0 18px 50px -18px oklch(0% 0 0 / .65);
    --radius: 16px; --r-sm: 12px;
    --font-d:"Space Grotesk",system-ui,sans-serif; --font-b:"Inter",system-ui,sans-serif;
    --font-m:"JetBrains Mono",ui-monospace,monospace; --font-jp:"Noto Sans JP",var(--font-d);
    --page-bg:#f3efe7; --page-ink:oklch(32% 0.02 60); --page-line:oklch(70% 0.02 70);
    --sat: env(safe-area-inset-top,0px); --sab: env(safe-area-inset-bottom,0px);
    --sat-l: env(safe-area-inset-left,0px); --sat-r: env(safe-area-inset-right,0px);
    color-scheme: dark;
  }
  html[data-theme="paper"]{
    --bg: oklch(97% 0.014 85); --surface: oklch(99% 0.007 85); --elevated: oklch(100% 0 0);
    --fg: oklch(26% 0.022 60); --muted: oklch(55% 0.02 70); --border: oklch(90% 0.013 80);
    --accent: oklch(63% 0.13 68); --accent-ink: oklch(99% 0.005 80);
    --accent-soft: oklch(70% 0.09 68 / .22);
    --shadow: 0 18px 40px -20px oklch(30% 0 0 / .22);
    --page-bg:#f6f2e9; --page-ink:oklch(33% 0.02 60); --page-line:oklch(74% 0.02 70);
    color-scheme: light;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:clamp(15px,.55vw + 13px,17px)}
  body{font-family:var(--font-b);background:var(--bg);color:var(--fg);line-height:1.55;
    overflow:hidden;transition:background .45s ease,color .45s ease}
  ::selection{background:var(--accent);color:var(--accent-ink)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  img{display:block;max-width:100%}
  .mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
  .row{display:flex;align-items:center}
  .gap8{gap:8px}.gap12{gap:12px}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:1fr;height:100dvh}
  .main{overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
  .view{max-width:1180px;margin:0 auto;padding:calc(16px + var(--sat)) calc(18px + var(--sat-l)) calc(96px + var(--sab)) calc(18px + var(--sat-r))}
  .reading .view{padding:0}

  /* ---------- desktop rail ---------- */
  .rail{display:none;position:fixed;inset:0 auto 0 0;width:76px;z-index:60;flex-direction:column;align-items:center;
    gap:6px;padding:calc(20px + var(--sat)) 12px calc(18px + var(--sab));border-right:1px solid var(--border);
    background:color-mix(in oklch,var(--surface) 82%,transparent);backdrop-filter:blur(18px)}
  .rail .mark{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--border);border-radius:14px;
    font-family:var(--font-jp);font-weight:900;font-size:1.25rem;color:var(--accent);background:var(--surface)}
  .rail .spacer{flex:1}
  .rail button{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;color:var(--muted);position:relative}
  .rail button:hover{color:var(--fg);background:var(--elevated)}
  .rail button.active{color:var(--accent);background:var(--accent-soft)}
  .rail button.small{width:38px;height:38px;border-radius:11px}
  @media(min-width:960px){
    .shell{grid-template-columns:76px 1fr}
    .rail{display:flex}
    .tabbar{display:none !important}
    .view{padding-top:calc(28px + var(--sat))}
  }

  /* ---------- mobile top + tabbar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:calc(18px + var(--sat));min-height:44px;gap:10px}
  .topbar .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--border);border-radius:12px;
    font-family:var(--font-jp);font-weight:900;color:var(--accent);background:var(--surface)}
  .brand .name{font-family:var(--font-d);font-weight:700;font-size:1.05rem;letter-spacing:.14em}
  .brand .name small{display:block;font-family:var(--font-b);font-weight:500;font-size:.6rem;letter-spacing:.3em;color:var(--muted);margin-top:1px}
  .iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;color:var(--muted);flex:none}
  .iconbtn:hover{color:var(--fg);background:var(--elevated)}
  .iconbtn svg{width:21px;height:21px}
  .tabbar{position:fixed;inset:auto 0 0 0;z-index:60;display:flex;justify-content:space-around;align-items:center;
    padding:8px 10px calc(10px + var(--sab));border-top:1px solid var(--border);
    background:color-mix(in oklch,var(--bg) 82%,transparent);backdrop-filter:blur(20px)}
  .tb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.64rem;font-weight:600;color:var(--muted);
    width:64px;padding:6px 0;border-radius:12px;letter-spacing:.06em}
  .tb svg{width:22px;height:22px}
  .tb.active{color:var(--accent)}
  .tb.active .tbdot{width:16px;height:3px;border-radius:2px;background:var(--accent)}

  /* ---------- typography / sections ---------- */
  .eyebrow{font-family:var(--font-m);font-size:.68rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  .greet h1{font-family:var(--font-d);font-size:clamp(1.7rem,4.4vw,2.4rem);font-weight:700;letter-spacing:-.02em;margin-top:4px}
  section{margin-top:34px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .sec-head h2{font-family:var(--font-d);font-size:1.12rem;font-weight:600;letter-spacing:-.01em}
  .sec-head .more{font-size:.78rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px}
  .sec-head .more:hover{color:var(--fg)}
  .rail-x{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 10px;margin:0 calc(-18px + var(--sat-l)*-1 * 0);margin-left:calc(-18px - var(--sat-l));padding-left:18px;padding-right:18px}
  .rail-x::-webkit-scrollbar{display:none}

  /* ---------- search bar ---------- */
  .searchbar{display:flex;align-items:center;gap:10px;width:100%;height:52px;padding:0 16px;border:1px solid var(--border);
    border-radius:16px;background:var(--surface);color:var(--muted);font-size:.92rem;transition:border-color .2s ease}
  .searchbar:hover{border-color:color-mix(in oklch,var(--accent) 45%,var(--border))}
  .searchbar kbd{font-family:var(--font-m);font-size:.68rem;padding:2px 8px;border:1px solid var(--border);border-radius:7px;color:var(--muted);margin-left:auto}

  /* ---------- covers ---------- */
  .cover{position:relative;aspect-ratio:3/4.15;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);
    background:linear-gradient(160deg,var(--c1),var(--c2) 58%,var(--c3));flex:none;isolation:isolate}
  .cover::before{content:"";position:absolute;inset:0;background:
      radial-gradient(140% 90% at 20% 8%,oklch(100% .02 90/.14),transparent 48%),
      radial-gradient(100% 100% at 92% 96%,oklch(0% 0 0/.34),transparent 55%),
      repeating-radial-gradient(circle at 30% 36%,oklch(100% 0 0/.05) 0 1.5px,transparent 1.5px 10px);opacity:.7}
  .cover::after{content:attr(data-glyph);position:absolute;right:-6%;bottom:-9%;font-family:var(--font-jp);font-weight:900;
    font-size:clamp(5rem,16vw,7.5rem);line-height:1;color:oklch(100% .02 90/.28);transform:rotate(-8deg);user-select:none;}
  .cover .c-type{position:absolute;top:9px;left:9px;font-family:var(--font-m);font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;
    color:oklch(99% 0 0/.9);background:oklch(12% 0 0/.42);backdrop-filter:blur(6px);padding:3px 8px;border-radius:99px}
  .cover .c-rate{position:absolute;bottom:9px;right:9px;font-family:var(--font-m);font-size:.6rem;color:oklch(99% 0 0/.92);
    background:oklch(12% 0 0/.42);backdrop-filter:blur(6px);padding:3px 8px;border-radius:99px;display:flex;align-items:center;gap:4px}
  .cover .c-glow{position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(transparent,oklch(8% 0 0/.55));z-index:-1}

  /* card */
  .mcard{position:relative;width:132px;flex:none;display:flex;flex-direction:column;gap:8px}
  .mcard .cover{width:100%}
  .mcard h3{font-size:.82rem;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mcard .meta{font-family:var(--font-m);font-size:.62rem;color:var(--muted)}
  .mcard .rank{position:absolute;top:8px;left:8px;z-index:2;font-family:var(--font-d);font-weight:700;font-size:1.15rem;color:var(--fg);
    text-shadow:0 1px 8px oklch(0% 0 0/.7);opacity:.95}
  .mcard .rank.plus{top:auto;bottom:52%;font-size:.7rem;left:9px;opacity:0}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--border);border-radius:99px;
    font-size:.8rem;font-weight:500;color:var(--muted);white-space:nowrap;background:var(--surface)}
  .chip:hover{color:var(--fg);border-color:var(--muted)}

  /* continue shelf card */
  .ccard{width:300px;flex:none;display:grid;grid-template-columns:86px 1fr;gap:14px;padding:12px;border:1px solid var(--border);
    border-radius:var(--radius);background:var(--surface);align-items:center}
  .ccard .cover{width:86px}
  .ccard h3{font-size:.9rem;font-weight:600;line-height:1.2}
  .ccard .prog{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 7px}
  .ccard .prog .lbl{font-family:var(--font-m);font-size:.62rem;color:var(--muted)}
  .ccard .prog .pct{font-family:var(--font-m);font-size:.66rem;color:var(--accent);font-weight:600}
  .bar{height:3px;border-radius:2px;background:var(--border);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:2px;width:0}
  .ring{width:44px;height:44px;flex:none}
  .ring circle{fill:none;stroke:var(--border);stroke-width:3.4}
  .ring .arc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.6,.05,.2,1)}

  /* drops rows */
  .drow{display:flex;align-items:center;gap:14px;padding:10px 2px;border-bottom:1px solid var(--border)}
  .drow:last-child{border-bottom:0}
  .drow .cover{width:46px;border-radius:10px}
  .drow h3{font-size:.9rem;font-weight:600;line-height:1.2}
  .drow .sub{font-family:var(--font-m);font-size:.64rem;color:var(--muted);margin-top:2px}
  .drow .when{margin-left:auto;font-family:var(--font-m);font-size:.64rem;color:var(--muted);white-space:nowrap}

  /* spotlight */
  .spot{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--border);min-height:240px;display:flex;align-items:flex-end;
    background:linear-gradient(160deg,var(--c1),var(--c2) 55%,var(--c3))}
  .spot::before{content:"";position:absolute;inset:0;background:
      radial-gradient(120% 90% at 80% -10%,oklch(100% .03 90/.25),transparent 50%),
      linear-gradient(transparent 18%,oklch(6% 0 0/.72));
    z-index:1}
  .spot .s-glyph{position:absolute;top:-74px;right:4px;font-family:var(--font-jp);font-weight:900;font-size:clamp(11rem,30vw,19rem);
    line-height:1;color:oklch(100% .02 90/.14);z-index:0;user-select:none;transform:rotate(-6deg)}
  .spot .s-bod{position:relative;z-index:2;padding:clamp(20px,3.4vw,34px);width:100%}
  .spot .kicker{font-family:var(--font-m);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:oklch(93% .04 90/.85);display:flex;align-items:center;gap:8px}
  .spot .kicker::before{content:"";width:22px;height:2px;background:currentColor;opacity:.8}
  .spot h1{font-family:var(--font-d);font-size:clamp(1.7rem,5.6vw,2.7rem);line-height:1.04;font-weight:700;letter-spacing:-.02em;
    color:oklch(99% 0 0);margin-top:8px;text-shadow:0 2px 24px oklch(0% 0 0/.45)}
  .spot .jp{font-family:var(--font-jp);font-size:.95rem;color:oklch(95% .01 90/.9);margin-top:6px}
  .spot .chips{display:flex;gap:8px;margin:14px 0 16px;flex-wrap:wrap}
  .spot .chip{background:oklch(0% 0 0/.22);border-color:oklch(100% 0 0/.22);color:oklch(98% 0 0);backdrop-filter:blur(6px);border-radius:99px;font-size:.72rem;padding:5px 12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:15px;
    font-weight:600;font-size:.92rem;letter-spacing:.01em}
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-ghost{border:1px solid var(--border);color:var(--fg);background:color-mix(in oklch,var(--surface) 60%,transparent)}
  .btn-ghost:hover{background:var(--surface)}

  /* ---------- detail ---------- */
  .dtop{position:relative;margin:calc(-16px - var(--sat)) calc(-18px) 0;padding-top:var(--sat)}
  .dtop .blur{position:absolute;inset:0;filter:saturate(1.25);opacity:.5;
    background:linear-gradient(155deg,var(--c1),var(--c2) 55%,var(--c3));mask-image:linear-gradient(black,transparent 88%)}
  .dtop .inner{position:relative;z-index:2;display:flex;align-items:flex-end;gap:clamp(16px,4vw,30px);padding:calc(70px + var(--sat)) 18px 26px;
    background:linear-gradient(transparent 30%,color-mix(in oklch,var(--bg) 88%,transparent))}
  @media(min-width:960px){.dtop{margin-left:0;margin-right:0;border-radius:0 0 26px 26px}.dtop .inner{padding-left:34px;padding-right:34px}}
  .dtop .cover{width:clamp(120px,30vw,198px)}
  @media(min-width:960px){.dtop .cover{width:200px}}
  .dtop h1{font-family:var(--font-d);font-size:clamp(1.7rem,5vw,2.6rem);font-weight:700;letter-spacing:-.02em;line-height:1.05}
  .dtop .jp{font-family:var(--font-jp);font-size:.92rem;color:var(--muted);margin-top:5px}
  .dstats{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;font-family:var(--font-m);font-size:.66rem}
  .dstats .ds{border:1px solid var(--border);border-radius:9px;padding:5px 9px;background:var(--surface)}
  .dstats .ds b{color:var(--fg);font-weight:600}
  .dcta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .dcta .btn{flex:1;min-width:150px;height:48px}
  .dbody{padding-top:26px;display:grid;gap:34px}
  @media(min-width:960px){.dbody{grid-template-columns:1fr 340px;gap:20px 40px}
    .dbody .dcol1{order:2}.dbody .dcol2{order:1}}
  .dsec h2{font-family:var(--font-d);font-size:1.05rem;font-weight:600;letter-spacing:-.01em;margin-bottom:12px}
  .synop{color:var(--muted);font-size:.94rem;line-height:1.75}
  .synop .more{color:var(--accent);cursor:pointer;font-weight:600}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .chlist{display:grid;max-height:520px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius)}
  .chrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
  .chrow:last-child{border-bottom:0}
  .chrow .cn{font-family:var(--font-m);font-size:.78rem;color:var(--muted);width:52px;flex:none}
  .chrow .cn b{color:var(--fg);font-weight:600}
  .chrow .ct{font-size:.82rem;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chrow .cd{margin-left:auto;font-family:var(--font-m);font-size:.62rem;color:var(--muted)}
  .chrow .cvh{font-size:.72rem;font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:7px;padding:2px 8px;font-family:var(--font-m)}
  .chrow:hover{background:var(--elevated)}
  .chrow.current{border-left:3px solid var(--accent)}

  /* ---------- search ---------- */
  .s-input{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:16px;background:var(--surface);
    padding:0 14px;height:54px;transition:border-color .2s}
  .s-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .s-input input{flex:1;border:0;background:none;font:inherit;font-size:1rem;color:var(--fg);outline:none;min-width:0}
  .s-input input::placeholder{color:var(--muted)}
  .rchip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;font-size:.78rem;font-weight:500;
    background:var(--surface);border:1px solid var(--border);color:var(--fg)}
  .rchip .x{color:var(--muted);font-family:var(--font-m)}
  .pill.active{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:16px 12px;margin-top:6px}
  .empty{border:1px dashed var(--border);border-radius:18px;padding:44px 24px;text-align:center;color:var(--muted)}
  .empty .big{font-family:var(--font-jp);font-size:3.4rem;line-height:1;color:var(--border);display:block;margin-bottom:12px}

  /* ---------- library ---------- */
  .seg{display:flex;gap:6px;padding:5px;border:1px solid var(--border);border-radius:13px;background:var(--surface);width:max-content}
  .seg button{padding:8px 15px;border-radius:9px;font-size:.8rem;font-weight:600;color:var(--muted)}
  .seg button.active{background:var(--elevated);color:var(--fg)}
  .luselect{border:1px solid var(--border);border-radius:11px;padding:9px 12px;font:inherit;font-size:.78rem;color:var(--fg);
    background:var(--surface);font-family:var(--font-m);outline:none}

  /* ---------- reader ---------- */
  .reader{display:flex;flex-direction:column;height:100dvh}

  /* chrome */
  .r-chrome{position:fixed;top:0;left:0;right:0;z-index:40;transition:opacity .4s ease,transform .4s ease}
  .r-top{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 14px 10px;
    background:linear-gradient(color-mix(in oklch,var(--bg) 92%,transparent),transparent)}
  .r-top .ttl{min-width:0;flex:1;display:flex;flex-direction:column}
  .r-top .ttl b{font-family:var(--font-d);font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-top .ttl span{font-family:var(--font-m);font-size:.62rem;color:var(--muted)}
  .r-top .iconbtn{width:40px;height:40px}
  .r-hair{height:2px;background:color-mix(in oklch,var(--border) 70%,transparent);overflow:hidden}
  .r-hair i{display:block;height:100%;width:0;background:var(--accent)}
  .r-bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;transition:opacity .4s ease,transform .4s ease;
    padding:14px 14px calc(14px + var(--sab))}
  .r-bbar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px;
    border:1px solid var(--border);border-radius:18px;background:color-mix(in oklch,var(--elevated) 88%,transparent);
    backdrop-filter:blur(20px);box-shadow:var(--shadow)}
  .r-bbar .grow{flex:1}
  .r-bbar .pg{text-align:center;font-family:var(--font-m);font-size:.7rem;color:var(--muted);white-space:nowrap}
  .r-bbar .pg b{color:var(--fg);font-weight:600}
  .mini{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--fg);background:var(--surface);border:1px solid var(--border);flex:none}
  .mini:hover{background:var(--elevated)}
  .mini.active{color:var(--accent);border-color:color-mix(in oklch,var(--accent) 55%,var(--border))}
  .mini svg{width:18px;height:18px}
  .r-chrome.hidden{opacity:0;pointer-events:none}
  .r-top.hidden,.r-bottom.hidden{transform:translateY(-100%)}.r-bottom.hidden{transform:translateY(100%)}

  /* pages */

/* ---------- page art generator (seeded, abstract manga panels) ---------- */
const SFX=["ドン","バシ","ゴゴ","ザザ","ドド","バン","シュウ","ギュン","ドクン","キン","ザワ","パン"];
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function pageNodes(d,page){
  const seed=glyphHash(d.id)*31+page*7, r=rng(seed), n=3+Math.floor(r()*2);
  let y=2, acc="", nodes=[];
  for(let i=0;i<n;i++){
    const paired=r()>.55, h=paired? (i===n-1? 96-y : (r()*18+34)) : (r()*30+26);
    if(y+h>99){y=2}
    const x=paired? (r()>.5? 51:2) : 2, w=paired? 47 : 96;
    const ink=r(), tone=r()>.6;
    const glyph=SFX[Math.floor(r()*SFX.length)];
    const lines=r()>.72;
    let inner=`<div class="p-inner" style="background:linear-gradient(${140+r()*80}deg,${tone?'oklch(88% .02 65)':'oklch(93% .015 80)'},${tone?'oklch(80% .025 58)':'oklch(86% .02 72)'})"></div>`;
    if(lines)inner+=`<div class="lines"></div>`;
    if(r()>.5)inner+=`<div class="dots"></div>`;
    inner+=`<div class="sfx" style="font-size:${7+r()*3}rem;top:${20+r()*50}%;left:${8+r()*30}%;transform:rotate(${r()*14-7}deg)">${glyph}</div>`;
    acc+=`<div class="panel" style="top:${y.toFixed(1)}%;left:${x}%;width:${w}%;height:${h.toFixed(1)}%;border-width:${ink>.8?2:1}px">${inner}</div>`;
    y+=h+1.2;
  }
  return `<div class="page"><div class="ink"></div>${acc}</div>`;
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

/* reader engine */
let R={};
function openReader(id,chLabel,startP){
  const d=M(id);if(!d){location.hash="#/home";return}
  STATE.route="read";
  document.body.classList.add("reading");
  document.getElementById("view").innerHTML=screenReader(id,chLabel);
  const wrap=document.getElementById("pages");
  const ch=parseInt(chLabel.slice(1))||1;
  const total=d.pages+clamp(ch%5-2,0,3);
  const mode=STATE.mode;
  wrap.innerHTML=Array.from({length:total},(_,i)=>pageNodes(d,i+1)).join("");
  const hair=document.getElementById("rHair"),pgT=document.getElementById("rPg");
  const p=clamp(startP||1,1,total);
  R={d,ch,total,wrap,page:p};
  const setStore=()=>{
    STATE.progress[d.id]={ch,pct:Math.round((R.page/total)*100)};
    STORE.set("progress",STATE.progress);
  };
  const syncUI=()=>{
    if(pgT)pgT.innerHTML=`<b>${R.page}</b> / ${total} · Ch ${ch}`;
    gsap.to(hair,{width:(R.page/total*100).toFixed(1)+"%",duration:.3,ease:"power2.out"});
    setStore();
  };
  const goCh=dir=>{const nc=clamp(ch+dir,1,d.ch);openReader(d.id,"p"+nc,dir>0?1:total)};
  const slide=t=>gsap.to(wrap,{scrollTop:Math.max(0,t),duration:.38,ease:"power2.out"});

  if(mode==="vertical"){
    wrap.classList.add("v");
    const H=Math.max(440,Math.min(560,total>30?520:560)), step=H-2;
    R.step=step;
    wrap.querySelectorAll(".page").forEach(el=>{el.style.aspectRatio="auto";el.style.height=H+"px";el.style.marginBottom="-2px"});
    R.next=()=>wrap.scrollTop+wrap.clientHeight>=wrap.scrollHeight-4?goCh(1):slide(wrap.scrollTop+step);
    R.prev=()=>wrap.scrollTop<=4?goCh(-1):slide(wrap.scrollTop-step);
    const upd=()=>{
      const rect=wrap.getBoundingClientRect(),mid=rect.top+rect.height*0.42;
      let cur=1;wrap.querySelectorAll(".page").forEach((e,i)=>{if(e.getBoundingClientRect().top<=mid)cur=i+1});
      R.page=cur;syncUI();
    };
    wrap.addEventListener("scroll",upd,{passive:true});
    wrap.scrollTop=(p-1)*step;
    setTimeout(()=>{wrap.classList.add("showtip");setTimeout(()=>wrap.classList.remove("showtip"),2600)},500);
    upd();
  }else{
    wrap.classList.add("p");
    const els=[...wrap.querySelectorAll(".page")];
    els.forEach((e,i)=>e.style.display=i===p-1?"block":"none");
    const show=i=>{
      i=clamp(i,1,total);
      const out=els[R.page-1]||els[0];
      gsap.to(out,{rotationY:-70,autoAlpha:0,duration:.4,ease:"power3.in",onComplete:()=>{
        els.forEach((e,k)=>e.style.display=k===i-1?"block":"none");
        gsap.fromTo(els[i-1],{rotationY:70,autoAlpha:0},{rotationY:0,autoAlpha:1,duration:.5,ease:"power3.out",onComplete:()=>{
          R.page=i;syncUI();wrap.classList.add("showedges");setTimeout(()=>wrap.classList.remove("showedges"),600);
        }});
      }});
    };
    R.next=()=>R.page<total?show(R.page+1):goCh(1);
    R.prev=()=>R.page>1?show(R.page-1):goCh(-1);
    gsap.fromTo(els[p-1],{autoAlpha:0},{autoAlpha:1,duration:.4,delay:.05,onComplete:()=>{R.page=p;syncUI()}});
    document.getElementById("rNext").onclick=R.next;
    document.getElementById("rPrev").onclick=R.prev;
    document.getElementById("tR").onclick=R.next;
    document.getElementById("tL").onclick=R.prev;
  }
  document.getElementById("rNextC").onclick=()=>goCh(1);
  document.getElementById("rPrevC").onclick=()=>goCh(-1);
  document.getElementById("rClose").onclick=()=>{location.hash="#/m/"+id};
  document.getElementById("rMode").onclick=()=>{
    STATE.mode=STATE.mode==="vertical"?"paginated":"vertical";STORE.set("mode",STATE.mode);
    openReader(d.id,"p"+ch,R.page);
  };
  const rLamp=document.getElementById("rLamp");
  rLamp.onclick=()=>{STATE.lamp=!STATE.lamp;wrap.classList.toggle("lamp",STATE.lamp);rLamp.classList.toggle("active",STATE.lamp)};
  if(STATE.lamp){wrap.classList.add("lamp");rLamp.classList.add("active")}
  /* chrome auto-hide */
  let hideT;
  const chrome=()=>{const sc=document.getElementById("rChrome"),bo=document.querySelector(".r-bottom");
    sc.classList.remove("hidden");bo.classList.remove("hidden");clearTimeout(hideT);hideT=setTimeout(()=>{sc.classList.add("hidden");bo.classList.add("hidden")},2800)};
  chrome();
  wrap.addEventListener("pointermove",chrome);
  wrap.addEventListener("pointerdown",chrome);
}
document.addEventListener("keydown",e=>{
  if(STATE.route!=="read"||!R.d)return;
  if(e.key==="ArrowRight"){e.preventDefault();R.next&&R.next()}
  else if(e.key==="ArrowLeft"){e.preventDefault();R.prev&&R.prev()}
  else if(e.key==="Escape"){location.hash="#/m/"+R.d.id}
});

/* ---------- router ---------- */
const routes=[
  [/^home$/,screenHome],
  [/^search$/,screenSearch],
  [/^library$/,screenLibrary],
  [/^m\/(.+)$/,(m,id)=>screenDetail(id)],
  [/^r\/(.+)\/(p\d+)$/,openReader]
];
function router(){
  const h=(location.hash||"#/home").replace(/^#\//,"");
  if(STATE.route==="read")document.body.classList.remove("reading");
  const reading=h.split("/")[0]==="r";
  let m=null;
  for(const [re,fn] of routes){
    m=h.match(re);
    if(m){
      if(fn===screenDetail)fn(m[1]);
      else if(fn===openReader)fn(m[1],m[2]);
      else fn();
      break;
    }
  }
  if(!m)screenHome();
  // mark tabs
  document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===h.split("/")[0]));
  document.querySelectorAll(".tb").forEach(b=>b.classList.toggle("active",b.dataset.nav==="#/"+h.split("/")[0]));
  const v=document.getElementById("view");
  if(!reading)gsap.fromTo(v.querySelectorAll(".fade-item,.sec-head,.ccard,.spot,.greet"),{y:14,autoAlpha:0},{y:0,autoAlpha:1,duration:.5,stagger:.05,ease:"power2.out",clearProps:"all"});
  /* rail anims */
  requestAnimationFrame(()=>{
    document.querySelectorAll("[data-anim]").forEach(rail=>{
      gsap.fromTo(rail.querySelectorAll(".fade-item"),{y:18,autoAlpha:0},{y:0,autoAlpha:1,duration:.5,stagger:.05,ease:"power2.out",scrollTrigger:{trigger:rail,start:"top 92%",once:true},delay:.05});
    });
  });
  if(m&&h.startsWith("m/"))initDetail(m[1]);
  if(h.split("/")[0]==="search")initSearch();
  if(h.split("/")[0]==="library")initLibrary();
  animateBars();
}
function initDetail(id){
  const d=M(id);document.getElementById("dStart").onclick=()=>{location.hash=`#/r/${id}/p${STATE.progress[id]?STATE.progress[id].ch:1}`};

    const i=STATE.lib.indexOf(id);
    if(i>-1){STATE.lib.splice(i,1);document.getElementById("dLib").innerHTML="+ Library";document.getElementById("dLib").classList.add("btn-ghost");document.getElementById("dLib").style.background=""}
    else{STATE.lib.unshift(id);document.getElementById("dLib").innerHTML="In your library";document.getElementById("dLib").classList.remove("btn-ghost");document.getElementById("dLib").style.background="var(--elevated)";document.getElementById("dLib").style.border="1px solid var(--border)"}

function initSearch(){
  const q=document.getElementById("sQ");if(!q)return;
  const pills=[...document.querySelectorAll("#sPills .pill")];
  const res=document.getElementById("sRes");
  const cnt=res.closest("section").querySelector(".sec-head .mono");
  const recW=document.getElementById("sRec");
  const clearBtn=document.getElementById("sClear");
  const recSec=recW.closest("section");
  const renderRec=()=>{
    const recent=STORE.get("recent",[]);
    recW.innerHTML=recent.map(t=>`<button class="rchip" data-term="${esc(t)}">${esc(t)}<span class="x">×</span></button>`).join("");
    recSec.style.display=recent.length&&!(q.value||"").trim()&&!SESSION.genre?"block":"none";
    recW.querySelectorAll(".rchip").forEach(c=>{
      c.onclick=e=>{
        if(e.target.classList.contains("x")){
          STORE.set("recent",STORE.get("recent",[]).filter(x=>x!==c.dataset.term));renderRec();return;
        }
        q.value=c.dataset.term;SESSION.genre=null;apply();
      };
    });
  };
  const apply=()=>{
    const term=(q.value||"").trim().toLowerCase();
    pills.forEach(p=>p.classList.toggle("active",!!SESSION.genre&&p.dataset.g===SESSION.genre));
    let list=DATA;
    if(SESSION.genre)list=list.filter(d=>d.g.includes(SESSION.genre));
    if(term)list=list.filter(d=>(d.t+" "+d.orig+" "+d.g.join(" ")).toLowerCase().includes(term));
    res.innerHTML=list.length?list.map(recResults).join("")
      :`<div class="empty" style="grid-column:1/-1"><span class="big">読</span>No hits${term?` for “${esc(term)}”`:""}.<br><small style="color:var(--fg)">Try another title, or clear the genre filter.</small></div>`;
    cnt.textContent=list.length;
    clearBtn.style.display=term?"block":"none";
    renderRec();
  };
  q.addEventListener("input",()=>apply());
  q.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&q.value.trim()){
      const seen=new Set(),out=[];
      for(const x of [q.value.trim(),...STORE.get("recent",[])]){
        const k=x.toLowerCase();
        if(!seen.has(k)){seen.add(k);out.push(x)}
        if(out.length>=6)break;
      }
      STORE.set("recent",out);renderRec();
    }
  });
  clearBtn.onclick=()=>{q.value="";SESSION.genre=null;apply()};
  const pillApply=()=>pills.forEach(p=>p.classList.toggle("active",!!SESSION.genre&&p.dataset.g===SESSION.genre));
  pills.forEach(p=>p.onclick=()=>{SESSION.genre=SESSION.genre===p.dataset.g?null:p.dataset.g;apply()});
  document.getElementById("sRecClear").onclick=()=>{STORE.set("recent",[]);renderRec()};
  apply();
}
function animateBars(){
  gsap.fromTo(".ccard .bar i",{width:0},{width:(i,el)=>el.parentElement.parentElement.querySelector(".pct").textContent.replace("%","")+"%",duration:.9,ease:"power2.out",scrollTrigger:{trigger:".rail-x",start:"top 92%",once:true}});
  gsap.fromTo(".ring .arc",{strokeDashoffset:283},{strokeDashoffset:i=>(1-(i/100))*283,duration:1,ease:"power2.out"});
}
/* generic nav */
document.addEventListener("click",e=>{
  const n=e.target.closest("[data-nav]");
  if(n){e.preventDefault();location.hash=n.dataset.nav;}
});
window.addEventListener("hashchange",router);
document.addEventListener("DOMContentLoaded",()=>{applyPrefs();renderShell();router();initTweaks()});
/* mood chips → open search pre-filtered by genre */
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip[data-g]:not(.pill)");
  if(c){SESSION.genre=c.dataset.g;location.hash="#/search";}
});
/* theme toggle (delegated since buttons rerender) */
document.addEventListener("click",e=>{if(e.target.closest("#themebtn"))toggleTheme()});

/* ---------- tweaks ---------- */
function initTweaks(){
  const panel=document.getElementById("twPanel");
  const build=()=>{
    panel.innerHTML=`
      <h4>Design tweaks</h4>
      <div class="lbl">Accent</div>
      <div class="swatches">${Object.keys(ACCENTS).map(k=>`<button class="swatch ${STATE.accent===k?"active":""}" data-a="${k}" style="background:${ACCENTS[k][STATE.theme]}" title="${k}"></button>`).join("")}</div>
      <div class="lbl">Default reading mode</div>
      <div class="sw"><button data-r="vertical" class="${STATE.mode==="vertical"?"active":""}">Vertical</button><button data-r="paginated" class="${STATE.mode==="paginated"?"active":""}">Page flip</button></div>
      <div class="lbl">Light / Dark</div>
      <div class="sw"><button data-t="night" class="${STATE.theme==="night"?"active":""}">Night</button><button data-t="paper" class="${STATE.theme==="paper"?"active":""}">Paper</button></div>`;
    panel.querySelectorAll(".swatch").forEach(b=>b.onclick=()=>{STATE.accent=b.dataset.a;STORE.set("accent",STATE.accent);applyPrefs();build();});
    panel.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{STATE.mode=b.dataset.r;STORE.set("mode",STATE.mode);build();});
    panel.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{STATE.theme=b.dataset.t;STORE.set("theme",STATE.theme);applyPrefs();build();});
    animateIn();
  };
  const animateIn=()=>gsap.fromTo(panel,{autoAlpha:0,y:8,scale:.96},{autoAlpha:1,y:0,scale:1,duration:.28,ease:"power2.out"});
  document.getElementById("twF").onclick=()=>{
    if(panel.style.display!=="none"){gsap.to(panel,{autoAlpha:0,duration:.15,onComplete:()=>panel.style.display="none"});}
    else{panel.style.display="block";build();}
  };
}
/* keyboard shortcut: "/" focuses search */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){const t=document.getElementById("twPanel");if(t&&t.style.display!=="none"){t.style.display="none";return}}
  if(e.key==="/"&&STATE.route!=="read"&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();location.hash="#/search"}
});
</script>
